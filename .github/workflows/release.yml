name: Release

on:
  release:
    types:
      - published

jobs:
  package-macos:
    name: Package (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      # An optional SemVer-style pre-release suffix (`-beta.1`, `-rc.2`, ...) is accepted here for
      # BuildConfig.VERSION / display purposes, but composeApp/build.gradle.kts strips it before
      # the numeric-only value reaches jpackage's packageVersion (MAJOR.MINOR.PATCH required).
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a jpackage-compatible version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # setup-gradle validates the Gradle wrapper jars by default (`validate-wrappers`), so
      # there is no separate wrapper-validation step.
      # The cache is disabled in every job of this workflow: what it builds is signed and shipped,
      # so it must never be assembled from cache entries another run wrote (cache poisoning).
      # Releases are rare, so the cold build this forces costs little.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # packageDmg is skipped for a pre-release tag (see package-windows' packageMsi for the same
      # reasoning), so createDistributable — normally pulled in transitively by packageDmg — is
      # requested explicitly to still produce the app bundle for the "Zip non-packaged app bundle"
      # step below. It's run as its own invocation (rather than alongside packageDmg in one
      # gradlew call) so the retry loop below only re-runs the DMG task, not this one.
      - name: Package App bundle (+ Dmg for stable releases)
        shell: bash
        run: |
          ./gradlew :composeApp:createDistributable -PappVersion=${{ steps.version.outputs.version }}
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            # See ci.yml's "Verify packaging (macOS)" step for why this retries only an
            # hdiutil-caused failure.
            for attempt in 1 2 3; do
              log="$RUNNER_TEMP/packageDmg-$attempt.log"
              if ./gradlew :composeApp:packageDmg -PappVersion=${{ steps.version.outputs.version }} 2>&1 | tee "$log"; then
                break
              fi
              if [ "$attempt" = 3 ] || ! grep -q hdiutil "$log"; then
                exit 1
              fi
              echo "::warning::packageDmg hit a transient hdiutil failure (attempt $attempt); retrying."
              for volume in /Volumes/Keryx*; do
                if [ -d "$volume" ]; then hdiutil detach "$volume" -force || true; fi
              done
              sleep 5
            done
          fi
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      # macos-latest runners are arm64, so the artifact name records the architecture to leave
      # room for an x86_64 (or universal) build alongside it later.
      - name: Rename artifact
        id: artifact
        if: steps.version.outputs.is_prerelease != 'true'
        run: |
          src=$(find composeApp/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::No DMG produced under composeApp/build/compose/binaries/main/dmg."
            exit 1
          fi
          dest="Keryx-${{ steps.version.outputs.version }}-macos-arm64.dmg"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Zip non-packaged app bundle
        run: |
          src="composeApp/build/compose/binaries/main/app/Keryx.app"
          dest="Keryx-${{ steps.version.outputs.version }}-macos-arm64.zip"
          (cd "$(dirname "$src")" && zip -ry "$OLDPWD/$dest" "$(basename "$src")")

      - name: Attach to release
        run: |
          assets=("Keryx-${{ steps.version.outputs.version }}-macos-arm64.zip")
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            assets+=("${{ steps.artifact.outputs.path }}")
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  # The SwiftUI macOS app (Developer ID signed, notarized, updated through Sparkle). It runs next to
  # package-macos (the Compose build) until that job is retired and replaced by this one; until
  # then deploy-pages does not wait for it, and its files carry a "-swiftui" suffix so they cannot
  # overwrite package-macos's. While the Apple Developer ID / notarization secrets are not all
  # configured it only reports what is missing and succeeds, building and uploading nothing — never
  # an unsigned build. See docs/build.md's "Release (CD)".
  package-macos-swiftui:
    name: Package (macOS arm64, SwiftUI)
    runs-on: macos-26
    # Notarization alone can take a while; the build itself needs about ten minutes.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ARTIFACT_SUFFIX: -swiftui

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Every step below is gated on this one. An unset secret reaches the script as an empty
      # string, which counts as missing.
      - name: Check configuration
        id: config
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: .github/scripts/check-release-config.sh

      # Same tag handling as package-macos: `v0.1.0` -> `0.1.0`, with an optional SemVer-style
      # pre-release suffix, which also means no .dmg.
      - name: Resolve version from tag
        id: version
        if: steps.config.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid release version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.config.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Install XcodeGen
        if: steps.config.outputs.configured == 'true'
        run: brew install xcodegen

      # The certificate goes into a throwaway keychain that is deleted at the end; the profile and
      # the notarization key are only written to the runner's temp directory.
      - name: Import signing credentials
        if: steps.config.outputs.configured == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.provisioningprofile"
          .github/scripts/prepare-notary-key.sh "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarize and package
        if: steps.config.outputs.configured == 'true'
        env:
          # Pinned, not the image default, so a runner image update cannot change the toolchain
          # (AppIcon.icon needs Xcode 26). Update together with the runner image.
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          OUTPUT_DIR: ${{ runner.temp }}/release-assets
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/profile.provisioningprofile
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_APPLE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_APPLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_DRIVE_APPLE_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_DRIVE_APPLE_CLIENT_ID is not set; Google Drive will be hidden in this build."
          fi
          .github/scripts/package-macos-swiftui.sh

      # Signs the archive with the release EdDSA key; Sparkle clients reject an update whose
      # signature does not match the SUPublicEDKey in the app they are running.
      - name: Generate the Sparkle appcast
        if: steps.config.outputs.configured == 'true'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          ZIP_PATH: ${{ runner.temp }}/release-assets/Keryx-${{ steps.version.outputs.version }}-macos-arm64${{ env.ARTIFACT_SUFFIX }}.zip
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          OUTPUT_DIR: ${{ runner.temp }}/release-assets
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: .github/scripts/generate-appcast.sh

      # The only step that writes to the release, and it only runs if every step above succeeded.
      - name: Attach to release
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSETS_DIR: ${{ runner.temp }}/release-assets
          ZIP_NAME: Keryx-${{ steps.version.outputs.version }}-macos-arm64${{ env.ARTIFACT_SUFFIX }}.zip
        run: |
          set -euo pipefail
          [ -s "$ASSETS_DIR/$ZIP_NAME" ] || { echo "::error::$ZIP_NAME was not produced."; exit 1; }
          [ -s "$ASSETS_DIR/appcast.xml" ] || { echo "::error::appcast.xml was not produced."; exit 1; }
          gh release upload "$RELEASE_TAG" "$ASSETS_DIR"/* --clobber

      - name: Remove signing credentials
        if: always() && steps.config.outputs.configured == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.provisioningprofile" "$RUNNER_TEMP/AuthKey.p8"

  package-linux:
    name: Package (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      # One failing leg must not stop the other's assets from reaching the release — an arm64
      # packaging failure, say, should not withhold the x86_64 deb/rpm/zip that already succeeded.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      # An optional SemVer-style pre-release suffix (`-beta.1`, `-rc.2`, ...) is accepted here for
      # BuildConfig.VERSION / display purposes, but composeApp/build.gradle.kts strips it before
      # the numeric-only value reaches jpackage's packageVersion (MAJOR.MINOR.PATCH required).
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a jpackage-compatible version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # :composeApp is an android.kotlin.multiplatform.library (see its `android { compileSdk }`
      # block), so AGP needs ANDROID_HOME to resolve the *configuration* phase alone, even though
      # this job never builds :androidApp. ubuntu-latest already ships the Android SDK, but the
      # ubuntu-24.04-arm image used for the arm64 leg does not, so this step is load-bearing there
      # (unlike the same step in the package-android job below, kept only as a guard against a
      # future ubuntu-latest image change).
      - name: Set up Android SDK
        if: matrix.arch == 'arm64'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # jpackage shells out to fakeroot for .deb and rpmbuild (package "rpm") for .rpm; neither
      # is guaranteed present on the runner image.
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      # createDistributable must be requested explicitly: packageDeb/packageRpm build directly
      # from the JLink runtime image and never depend on it (unlike packageDmg on macOS, which
      # does), so without it composeApp/build/compose/binaries/main/app never gets created and
      # the "Zip non-packaged app image" step below has nothing to zip. packageDeb/packageRpm are
      # skipped for a pre-release tag (see package-windows' packageMsi for the same reasoning).
      - name: Package App image (+ Deb/Rpm for stable releases)
        run: |
          tasks=(:composeApp:createDistributable)
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            tasks+=(:composeApp:packageDeb :composeApp:packageRpm)
          fi
          ./gradlew "${tasks[@]}" -PappVersion=${{ steps.version.outputs.version }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      # The artifact name records the architecture so the x86_64 and arm64 legs of this matrix
      # never collide on the same release asset name (same reasoning as the macOS arm64 tag).
      - name: Rename artifacts
        id: artifact
        if: steps.version.outputs.is_prerelease != 'true'
        run: |
          deb_src=$(find composeApp/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' | head -n 1)
          if [ -z "$deb_src" ]; then
            echo "::error::No deb produced under composeApp/build/compose/binaries/main/deb."
            exit 1
          fi
          rpm_src=$(find composeApp/build/compose/binaries/main/rpm -maxdepth 1 -name '*.rpm' | head -n 1)
          if [ -z "$rpm_src" ]; then
            echo "::error::No rpm produced under composeApp/build/compose/binaries/main/rpm."
            exit 1
          fi
          deb_dest="Keryx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.deb"
          rpm_dest="Keryx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.rpm"
          mv "$deb_src" "$deb_dest"
          mv "$rpm_src" "$rpm_dest"
          echo "paths=$deb_dest $rpm_dest" >> "$GITHUB_OUTPUT"

      - name: Zip non-packaged app image
        run: |
          src="composeApp/build/compose/binaries/main/app/Keryx"
          dest="Keryx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.zip"
          (cd "$(dirname "$src")" && zip -ry "$OLDPWD/$dest" "$(basename "$src")")

      - name: Attach to release
        run: |
          assets=("Keryx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.zip")
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            assets+=(${{ steps.artifact.outputs.paths }})
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  # Kept as its own job (not a step tacked onto package-linux) for two reasons: (1) a snapcraft
  # failure must not block the zip/deb/rpm from reaching the release — those already succeeded
  # and have nothing to do with the Store — and (2) `--destructive-mode` builds directly on the
  # runner with no sandboxing, so the runner OS must match `snap/snapcraft.yaml`'s `base: core24`
  # (Ubuntu 24.04) exactly; pinning that requirement to this job alone means a future
  # `ubuntu-latest` bump doesn't silently break deb/rpm packaging along with it. Bump `base:` and
  # both `runs-on:` values below together.
  package-snap:
    name: Package + publish Snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      # A Store publish failure or delay on one architecture must not hold back the other, same
      # reasoning as package-linux's own fail-fast: false.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            # snapcraft's own platform name, passed to `--platform` below — distinct from `arch`
            # (which matches the `.zip`/`.deb`/`.rpm` asset-naming convention elsewhere in this
            # workflow) purely because snapcraft's own vocabulary says "amd64", not "x86_64".
            platform: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      # An optional SemVer-style pre-release suffix (`-beta.1`, `-rc.2`, ...) is accepted here, and
      # snapcraft's own `version:` takes the full SemVer string as-is (unlike jpackage's
      # numeric-only packageVersion), so the snap is built for every tag, not just stable releases.
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # Unlike the deb/rpm/msi skip checks elsewhere in this workflow — which key on the tag
          # suffix alone — the Snap Store channel also honours the release's own pre-release flag:
          # a snap mis-channelled to `stable` is pushed to every Store user by snapd's own
          # auto-refresh, with no way to recall it.
          IS_GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a valid version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* || "$IS_GITHUB_PRERELEASE" == "true" ]]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # :composeApp is an android.kotlin.multiplatform.library, so AGP needs ANDROID_HOME to
      # resolve the configuration phase alone, even though this job only ever runs
      # createDistributable — see the identical step (and its comment) in package-linux above.
      - name: Set up Android SDK
        if: matrix.arch == 'arm64'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # snap/snapcraft.yaml's `keryx` part `dump`s this app image directly rather than rebuilding
      # anything, so createDistributable alone is enough — packageDeb/packageRpm are not needed here.
      - name: Package App image
        run: ./gradlew :composeApp:createDistributable -PappVersion=${{ steps.version.outputs.version }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: '$VERSION'/" snap/snapcraft.yaml
          # sed exits 0 even when nothing matched, so a reformatted snapcraft.yaml would otherwise
          # ship (and publish) a snap still stamped with the placeholder version below.
          if ! grep -qxF "version: '$VERSION'" snap/snapcraft.yaml; then
            echo "::error::Failed to stamp the version into snap/snapcraft.yaml."
            exit 1
          fi
          # --platform is required as soon as snapcraft.yaml declares more than one entry under
          # `platforms:` (see below): core24's --destructive-mode builds directly on the host with
          # no sandboxing, so it refuses to produce more than one snap per invocation and needs to
          # be told which of the declared platforms this runner is building.
          sudo snapcraft pack --destructive-mode --platform ${{ matrix.platform }} --output "Keryx-$VERSION-linux-${{ matrix.arch }}.snap"

      - name: Attach to release
        run: gh release upload "$RELEASE_TAG" "Keryx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.snap" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      # Skipped entirely until SNAPCRAFT_STORE_CREDENTIALS is configured (see docs/build.md),
      # so this job keeps succeeding for every release in the meantime instead of failing on a
      # secret that doesn't exist yet — the same pattern the cloud-provider keys above already
      # use (missing key -> feature absent, not a build failure).
      - name: Publish to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS not configured, skipping publish"
            exit 0
          fi
          snapcraft upload --release="${{ steps.version.outputs.channel }}" "Keryx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.snap"

  package-windows:
    name: Package (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      # An optional SemVer-style pre-release suffix (`-beta.1`, `-rc.2`, ...) is accepted here for
      # BuildConfig.VERSION / display purposes, but composeApp/build.gradle.kts strips it before
      # the numeric-only value reaches jpackage's packageVersion (MAJOR.MINOR.PATCH required).
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a jpackage-compatible version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # createDistributable must be requested explicitly: packageMsi is not guaranteed to depend
      # on it (unlike packageDmg on macOS), so without it the "Zip non-packaged app image" step
      # below has nothing to zip. windows-latest ships WiX Toolset v3.14.1 preinstalled, so no
      # separate WiX install step is needed here. packageMsi is skipped for a pre-release tag:
      # MSI's ProductVersion must be purely numeric (see appPackageVersion in build.gradle.kts), so
      # every pre-release of a given target version would collapse to the same ProductVersion under
      # the fixed upgradeUuid, and WiX would not recognize a later pre-release or the final release
      # as an upgrade of an earlier one.
      - name: Package App image (+ Msi for stable releases)
        run: |
          tasks=(:composeApp:createDistributable)
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            tasks+=(:composeApp:packageMsi)
          fi
          ./gradlew "${tasks[@]}" -PappVersion=${{ steps.version.outputs.version }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      # windows-latest runners are x86_64, so the artifact name records the architecture (same
      # reasoning as the macOS arm64 / Linux x86_64 tags).
      - name: Rename artifact
        id: artifact
        if: steps.version.outputs.is_prerelease != 'true'
        run: |
          src=$(find composeApp/build/compose/binaries/main/msi -maxdepth 1 -name '*.msi' | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::No MSI produced under composeApp/build/compose/binaries/main/msi."
            exit 1
          fi
          dest="Keryx-${{ steps.version.outputs.version }}-windows-x86_64.msi"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      # windows-latest has no `zip` CLI (unlike macos-latest / ubuntu-latest), so this step
      # overrides the job's default bash shell and uses PowerShell's built-in Compress-Archive
      # instead, which needs no extra install and preserves the same "Keryx/" top-level layout.
      - name: Zip non-packaged app image
        shell: pwsh
        run: |
          $src = "composeApp/build/compose/binaries/main/app/Keryx"
          $dest = "Keryx-${{ steps.version.outputs.version }}-windows-x86_64.zip"
          Compress-Archive -Path $src -DestinationPath $dest

      - name: Attach to release
        run: |
          assets=("Keryx-${{ steps.version.outputs.version }}-windows-x86_64.zip")
          if [ "${{ steps.version.outputs.is_prerelease }}" != "true" ]; then
            assets+=("${{ steps.artifact.outputs.path }}")
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  package-android:
    name: Package (Android universal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Read by attach-fdroid-version, so the tag is interpreted in one place only.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a compatible version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # `ubuntu-latest` (Ubuntu 24.04) already ships Android SDK Command Line Tools 12.0,
      # Build-tools 37.0.0, Platform-Tools 37.0.1, and SDK Platforms 34-37, so this step
      # is strictly optional. Kept for resilience against future runner-image changes.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # Decodes both signing identities androidApp/build.gradle.kts accepts: the app signing key
      # (signs githubRelease directly) and the upload key (signs the playRelease variant, AAB
      # included — see docs/build.md's "Publishing to Google Play"). ANDROID_UPLOAD_KEYSTORE_BASE64
      # is decoded only when set: GitHub maps an unset secret to an empty string rather than
      # leaving the variable unset, and decoding that would produce a 0-byte file that looks
      # "configured" to androidApp/build.gradle.kts's own null check — failing deep inside AGP
      # with an obscure keystore-format error instead of that file's own clear message. This job
      # always passes -PandroidReleaseSigningRequired=true below, which requires all eight signing
      # values regardless of whether the upload secret is genuinely missing or half-configured
      # (this project has a dedicated upload key registered with Play, so there is no
      # fall-back-to-app-signing path available to a publishing job — only a local,
      # -PandroidReleaseSigningRequired-less build can take that path); the point of decoding
      # conditionally here is purely to get androidApp/build.gradle.kts's own clear error message
      # instead of a 0-byte-keystore one from deep inside AGP.
      - name: Decode signing keystores
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          release_path="$RUNNER_TEMP/keryx-release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$release_path"
          chmod 600 "$release_path"
          echo "release_path=$release_path" >> "$GITHUB_OUTPUT"

          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            upload_path="$RUNNER_TEMP/keryx-upload.keystore"
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$upload_path"
            chmod 600 "$upload_path"
            echo "upload_path=$upload_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android release packages
        # No GOOGLE_DRIVE_CLIENT_ID/SECRET here (unlike the desktop packaging jobs below): Android's
        # Google Drive provider carries neither, since Play services identifies the app by package
        # name + signing certificate (see PlayServicesGoogleDriveAuth.kt), and the client secret now
        # generates into DesktopBuildConfig, which is only attached to desktopMain's srcDir — so it
        # isn't a build input for :androidApp at all.
        # androidReleaseSigningRequired turns a missing/half-configured secret above into a hard
        # build failure instead of androidApp/build.gradle.kts's own local-dev fallback (an
        # unsigned APK, or — for the upload key specifically — signing with the app signing key
        # instead) — this job publishes its output, so it must never succeed unsigned or with the
        # wrong signing identity on the AAB.
        # The APK comes from the "github" flavor (carries REQUEST_INSTALL_PACKAGES, the sideload
        # distribution an in-app update installs over) and the AAB from "play" (the Play Console
        # submission artifact, which must not carry that permission) — see
        # androidApp/build.gradle.kts's flavorDimensions and AndroidUpdateInstaller's own KDoc.
        # The "fdroid" APK is signed with the same app signing key as the github one: F-Droid builds
        # the same tag itself and, when the result matches this APK byte for byte apart from the
        # signature, publishes this one, so F-Droid users get the same signature as every other
        # channel (see distribution/fdroid/README.md). That only holds while F-Droid's build gets
        # the same inputs, which includes the DROPBOX_APP_KEY / ONEDRIVE_CLIENT_ID values below.
        run: >
          ./gradlew :androidApp:assembleGithubRelease :androidApp:bundlePlayRelease
          :androidApp:assembleFdroidRelease
          -PappVersion=${{ steps.version.outputs.version }}
          -PandroidReleaseSigningRequired=true
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.release_path }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ steps.keystore.outputs.upload_path }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Locate build outputs
        id: artifact
        run: |
          apk_src=$(find androidApp/build/outputs/apk/github/release -maxdepth 1 -name '*.apk' | head -n 1)
          fdroid_apk_src=$(find androidApp/build/outputs/apk/fdroid/release -maxdepth 1 -name '*.apk' | head -n 1)
          aab_src=$(find androidApp/build/outputs/bundle/playRelease -maxdepth 1 -name '*.aab' | head -n 1)
          if [ -z "$apk_src" ]; then
            echo "::error::No APK produced under androidApp/build/outputs/apk/github/release."
            exit 1
          fi
          if [ -z "$fdroid_apk_src" ]; then
            echo "::error::No APK produced under androidApp/build/outputs/apk/fdroid/release."
            exit 1
          fi
          if [ -z "$aab_src" ]; then
            echo "::error::No AAB produced under androidApp/build/outputs/bundle/playRelease."
            exit 1
          fi
          # Defense in depth on top of -PandroidReleaseSigningRequired=true above: AGP names an
          # unsigned release APK with an "-unsigned" suffix (it has no equivalent marker for the
          # AAB), so this is a cheap extra check right before the irreversible upload/publish below.
          for apk in "$apk_src" "$fdroid_apk_src"; do
            case "$apk" in
              *-unsigned.apk)
                echo "::error::Refusing to publish an unsigned APK ($apk)."
                exit 1
                ;;
            esac
          done
          apk_dest="Keryx-${{ steps.version.outputs.version }}-android-universal.apk"
          mv "$apk_src" "$apk_dest"
          echo "apk=$apk_dest" >> "$GITHUB_OUTPUT"
          # The "-android-fdroid.apk" suffix keeps it out of the in-app updater's reach: a sideloaded
          # install picks only "-android-universal.apk" (UpdateAsset.kt), and the fdroid build lacks
          # Google Drive and the update check. It exists for F-Droid's reproducible-build check.
          fdroid_apk_dest="Keryx-${{ steps.version.outputs.version }}-android-fdroid.apk"
          mv "$fdroid_apk_src" "$fdroid_apk_dest"
          echo "fdroid_apk=$fdroid_apk_dest" >> "$GITHUB_OUTPUT"
          # The AAB is never a GitHub Release asset — a user cannot install one, and
          # selectUpdateAsset never matches a `.aab` — so it keeps its AGP-generated name/location
          # and is only ever read by the publish-play job below, via the artifact uploaded next.
          echo "aab=$aab_src" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        run: gh release upload "$RELEASE_TAG" "${{ steps.artifact.outputs.apk }}" "${{ steps.artifact.outputs.fdroid_apk }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      # Hands the AAB to the publish-play job below without ever attaching it to the GitHub
      # Release (see the "Locate build outputs" comment above for why). Kept as a workflow
      # artifact rather than a job output — job outputs are strings, not files — with the
      # default retention; nothing outside this workflow run reads it. A Play publish failure
      # (e.g. transient API error, a permission grant still propagating) must not block
      # deploy-pages below, which is exactly why publish-play is its own job rather than more
      # steps tacked onto this one — same reasoning as package-snap's own separation from
      # package-linux.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: ${{ steps.artifact.outputs.aab }}

  # F-Droid builds the fdroid flavor itself, but its update checker cannot read this app's
  # versionCode from the tagged source (versionCodeOf computes it from the tag at build time, and
  # F-Droid's `Tags` mode only reads a literal). The recipe (distribution/fdroid/works.merc.keryx.yml)
  # therefore uses `UpdateCheckMode: HTTP` against this file on the latest release. versionCode comes
  # from versionCodeOf itself, through the printAndroidVersionCodes probe, never recomputed here.
  # Its own job rather than a step of package-android: a failure has to turn the run red — otherwise
  # the release becomes "latest" without the file and F-Droid silently never sees it — yet must not
  # hold back publish-play or deploy-pages, which depend on package-android alone. Re-run just this
  # job if it fails. Not an .apk, so the in-app updater's asset selection never considers it.
  attach-fdroid-version:
    name: Attach F-Droid version file
    needs: package-android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # Same as package-android: optional on ubuntu-latest, kept against runner-image changes.
      # Configuring :androidApp for the probe below needs the SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Attach F-Droid version file
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.package-android.outputs.version }}
        run: |
          version_code=$(./gradlew -q :androidApp:printAndroidVersionCodes -PversionCodeProbe="$VERSION" | sed -n "s/^${VERSION//./\\.}=//p")
          if ! [[ "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve the versionCode of $VERSION (got '$version_code')."
            exit 1
          fi
          printf '{"versionName":"%s","versionCode":%s}\n' "$VERSION" "$version_code" > fdroid-version.json
          cat fdroid-version.json
          gh release upload "$RELEASE_TAG" fdroid-version.json --clobber

  publish-play:
    name: Publish Android AAB to Google Play
    needs: package-android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Only for .github/scripts/publish-play.sh — nothing else in this job reads repo files.
      - name: Checkout publish script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: android-aab

      - name: Locate downloaded AAB
        id: artifact
        run: |
          aab_src=$(find . -name '*.aab' | head -n 1)
          if [ -z "$aab_src" ]; then
            echo "::error::No AAB found in the android-aab artifact from package-android."
            exit 1
          fi
          echo "aab=$aab_src" >> "$GITHUB_OUTPUT"

      # Track constants — comma-separated Play Developer API track ids, all published to in one
      # atomic edit by publish-play.sh (`alpha` is the id of Play Console's "closed testing").
      # Change these two once product-level access is approved (see docs/build.md's "Publishing
      # to Google Play"): a personal developer account created on or after 2023-11-13 cannot use
      # "production" or "open testing" until then, only "internal" and "closed". Keyed on the
      # GitHub Release's own prerelease flag, the same signal package-snap's channel-selection
      # step uses, not the tag suffix alone.
      - name: Resolve Play track
        id: play
        env:
          IS_GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          PLAY_TRACKS_PRERELEASE=internal,alpha
          PLAY_TRACKS_STABLE=internal,alpha
          if [ "$IS_GITHUB_PRERELEASE" = "true" ]; then
            echo "tracks=$PLAY_TRACKS_PRERELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "tracks=$PLAY_TRACKS_STABLE" >> "$GITHUB_OUTPUT"
          fi
          # Same skip-if-unconfigured pattern as SNAPCRAFT_STORE_CREDENTIALS below: publishing to
          # Play only starts once this secret exists, rather than failing every release until it does.
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Google Play's "recent changes" field is plain text, 500 characters per locale. Reuses the
      # GitHub Release body rather than maintaining a second, hand-written copy: drops the
      # generated header/compare-link lines, turns "### Heading" into a plain line and
      # "- **Title** — description (#N)" into "- Title", then truncates on a line boundary.
      # Written to *both* locales this project ships (ja-JP alongside en-US) with the same English
      # text — leaving ja-JP absent would make Play silently carry over whichever text that locale
      # last had, which is worse than a same-language duplicate. See docs/build.md.
      # This job's checkout is sparse and only for the publish script, so --repo is passed
      # explicitly rather than relying on `gh` inferring it from a git remote in the working directory.
      - name: Prepare Play release notes
        id: whatsnew
        if: steps.play.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          whatsnew_dir="$RUNNER_TEMP/play-whatsnew"
          mkdir -p "$whatsnew_dir"

          formatted=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body | awk '
            { line = $0; gsub(/\r$/, "", line) }
            line ~ /^## / { next }
            line ~ /^\*\*Full Changelog\*\*/ { next }
            line ~ /^$/ { next }
            line ~ /^### / { sub(/^### /, "", line); print line; next }
            line ~ /^- \*\*/ {
              rest = line
              sub(/^- \*\*/, "", rest)
              sub(/\*\*.*$/, "", rest)
              print "- " rest
            }
          ' | awk -v limit=500 '
            { len += length($0) + (NR > 1 ? 1 : 0) }
            len <= limit { print; next }
            { exit }
          ')

          if [ -z "$formatted" ]; then
            formatted="See the GitHub Release for details: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          fi

          printf '%s' "$formatted" > "$whatsnew_dir/whatsnew-en-US"
          printf '%s' "$formatted" > "$whatsnew_dir/whatsnew-ja-JP"
          echo "dir=$whatsnew_dir" >> "$GITHUB_OUTPUT"

      - name: Publish to Google Play
        if: steps.play.outputs.configured == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: works.merc.keryx
          AAB_PATH: ${{ steps.artifact.outputs.aab }}
          TRACKS: ${{ steps.play.outputs.tracks }}
          WHATSNEW_DIR: ${{ steps.whatsnew.outputs.dir }}
        run: .github/scripts/publish-play.sh

  deploy-pages:
    name: Update "https://keryx.merc.works" (trigger Cloudflare Pages deploy hook)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # package-linux is now a matrix (x86_64 + arm64); `needs` waits on every matrix leg to
    # succeed, so the page is only updated once both architectures' installers are live. Unlike
    # package-snap (deliberately excluded below), a matrix leg failing here withholds the page
    # update entirely, same as any other job in this list failing.
    needs:
      - package-macos
      - package-linux
      - package-windows
      - package-android
    permissions: {}

    steps:
      - name: Trigger deploy hook
        run: curl -d "" "${{ secrets.CF_DEPLOY_HOOK_URL }}"
