name: Release

on:
  release:
    types:
      - published

jobs:
  package-macos:
    name: Package (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      # An optional SemVer-style pre-release suffix (`-beta.1`, `-rc.2`, ...) is accepted here for
      # BuildConfig.VERSION / display purposes, but composeApp/build.gradle.kts strips it before
      # the numeric-only value reaches jpackage's packageVersion (MAJOR.MINOR.PATCH required).
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a jpackage-compatible version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package DMG
        run: ./gradlew :composeApp:packageDmg -PappVersion=${{ steps.version.outputs.version }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      # macos-latest runners are arm64, so the artifact name records the architecture to leave
      # room for an x86_64 (or universal) build alongside it later.
      - name: Rename artifact
        id: artifact
        run: |
          src=$(find composeApp/build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::No DMG produced under composeApp/build/compose/binaries/main/dmg."
            exit 1
          fi
          dest="Keryx-${{ steps.version.outputs.version }}-macos-arm64.dmg"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Zip non-packaged app bundle
        run: |
          src="composeApp/build/compose/binaries/main/app/Keryx.app"
          dest="Keryx-${{ steps.version.outputs.version }}-macos-arm64.zip"
          (cd "$(dirname "$src")" && zip -r "$OLDPWD/$dest" "$(basename "$src")")

      - name: Attach to release
        run: gh release upload "$RELEASE_TAG" '${{ steps.artifact.outputs.path }}' 'Keryx-${{ steps.version.outputs.version }}-macos-arm64.zip' --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  package-linux:
    name: Package (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      # An optional SemVer-style pre-release suffix (`-beta.1`, `-rc.2`, ...) is accepted here for
      # BuildConfig.VERSION / display purposes, but composeApp/build.gradle.kts strips it before
      # the numeric-only value reaches jpackage's packageVersion (MAJOR.MINOR.PATCH required).
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a jpackage-compatible version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # jpackage shells out to fakeroot for .deb and rpmbuild (package "rpm") for .rpm; neither
      # is guaranteed present on the ubuntu-latest image.
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      # createDistributable must be requested explicitly: packageDeb/packageRpm build directly
      # from the JLink runtime image and never depend on it (unlike packageDmg on macOS, which
      # does), so without it composeApp/build/compose/binaries/main/app never gets created and
      # the "Zip non-packaged app image" step below has nothing to zip.
      - name: Package Deb + Rpm + App image
        run: ./gradlew :composeApp:createDistributable :composeApp:packageDeb :composeApp:packageRpm -PappVersion=${{ steps.version.outputs.version }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      # ubuntu-latest runners are x86_64, so the artifact name records the architecture to leave
      # room for an arm64 build alongside it later (same reasoning as the macOS arm64 tag).
      - name: Rename artifacts
        id: artifact
        run: |
          deb_src=$(find composeApp/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' | head -n 1)
          if [ -z "$deb_src" ]; then
            echo "::error::No deb produced under composeApp/build/compose/binaries/main/deb."
            exit 1
          fi
          rpm_src=$(find composeApp/build/compose/binaries/main/rpm -maxdepth 1 -name '*.rpm' | head -n 1)
          if [ -z "$rpm_src" ]; then
            echo "::error::No rpm produced under composeApp/build/compose/binaries/main/rpm."
            exit 1
          fi
          deb_dest="Keryx-${{ steps.version.outputs.version }}-linux-x86_64.deb"
          rpm_dest="Keryx-${{ steps.version.outputs.version }}-linux-x86_64.rpm"
          mv "$deb_src" "$deb_dest"
          mv "$rpm_src" "$rpm_dest"
          echo "paths=$deb_dest $rpm_dest" >> "$GITHUB_OUTPUT"

      - name: Zip non-packaged app image
        run: |
          src="composeApp/build/compose/binaries/main/app/Keryx"
          dest="Keryx-${{ steps.version.outputs.version }}-linux-x86_64.zip"
          (cd "$(dirname "$src")" && zip -r "$OLDPWD/$dest" "$(basename "$src")")

      - name: Attach to release
        run: gh release upload "$RELEASE_TAG" ${{ steps.artifact.outputs.paths }} 'Keryx-${{ steps.version.outputs.version }}-linux-x86_64.zip' --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  package-windows:
    name: Package (Windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # The tag is the single source of truth for the released version: `v0.1.0` -> `0.1.0`.
      # An optional SemVer-style pre-release suffix (`-beta.1`, `-rc.2`, ...) is accepted here for
      # BuildConfig.VERSION / display purposes, but composeApp/build.gradle.kts strips it before
      # the numeric-only value reaches jpackage's packageVersion (MAJOR.MINOR.PATCH required).
      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$tag' does not yield a jpackage-compatible version (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # createDistributable must be requested explicitly: packageMsi is not guaranteed to depend
      # on it (unlike packageDmg on macOS), so without it the "Zip non-packaged app image" step
      # below has nothing to zip. windows-latest ships WiX Toolset v3.14.1 preinstalled, so no
      # separate WiX install step is needed here.
      - name: Package Msi + App image
        run: ./gradlew :composeApp:createDistributable :composeApp:packageMsi -PappVersion=${{ steps.version.outputs.version }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      # windows-latest runners are x86_64, so the artifact name records the architecture (same
      # reasoning as the macOS arm64 / Linux x86_64 tags).
      - name: Rename artifact
        id: artifact
        run: |
          src=$(find composeApp/build/compose/binaries/main/msi -maxdepth 1 -name '*.msi' | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::No MSI produced under composeApp/build/compose/binaries/main/msi."
            exit 1
          fi
          dest="Keryx-${{ steps.version.outputs.version }}-windows-x86_64.msi"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Zip non-packaged app image
        run: |
          src="composeApp/build/compose/binaries/main/app/Keryx"
          dest="Keryx-${{ steps.version.outputs.version }}-windows-x86_64.zip"
          (cd "$(dirname "$src")" && zip -r "$OLDPWD/$dest" "$(basename "$src")")

      - name: Attach to release
        run: gh release upload "$RELEASE_TAG" '${{ steps.artifact.outputs.path }}' 'Keryx-${{ steps.version.outputs.version }}-windows-x86_64.zip' --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  deploy-pages:
    name: Update "https://keryx.merc.works" (trigger Cloudflare Pages deploy hook)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - package-macos
      - package-linux
      - package-windows
    permissions: {}

    steps:
      - name: Trigger deploy hook
        run: curl -d "" "${{ secrets.CF_DEPLOY_HOOK_URL }}"
