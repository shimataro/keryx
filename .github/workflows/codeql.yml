name: CodeQL

on:
  push:
  schedule:
    # Weekly, matching the cadence the previous Default setup used.
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK 25
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6

      # The generic Gradle autobuilder Default setup used fails here: this is a Kotlin
      # Multiplatform project, so there is no root-level `testClasses` task - the real
      # tasks are namespaced per target (e.g. `composeApp:compileTestKotlinDesktop`).
      # Analysis only needs compiled code, not executed tests, so tests never run here.
      # --no-build-cache is required: the Gradle build cache setup-gradle restores can
      # satisfy these tasks with no compiler invocation at all (a cache hit from ci.yml's
      # own build of the same commit), which leaves CodeQL's build tracer with nothing to
      # observe and fails the whole analysis ("didn't build any of it").
      - name: Compile Kotlin sources for analysis
        if: matrix.build-mode == 'manual'
        run: ./gradlew :composeApp:assemble :composeApp:compileTestKotlinDesktop --no-configuration-cache --no-build-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
