name: CI

on:
  - push

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux/Windows additionally run createDistributable + native packaging below, so this matches
    # the 30 min budget release.yml's packaging jobs use.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compose UI tests (runDesktopComposeUiTest) render real Skia/AWT and need a display.
      # The Linux runner is headless, so run Gradle under a virtual X server (xvfb).
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # jpackage shells out to fakeroot for .deb and rpmbuild (package "rpm") for .rpm; neither
      # is guaranteed present on the ubuntu-latest image (see docs/setup.md).
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot rpm

      # `./gradlew build` pulls in :androidApp's release build type via AGP's default `assemble`
      # lifecycle. This job never publishes any artifact, so it deliberately supplies no signing
      # secrets — androidApp/build.gradle.kts's own signingConfigs block then builds an unsigned
      # release APK (with a build warning) instead of failing, which is exactly the behavior a
      # plain, unconfigured `./gradlew build` should have. Only release.yml (which does publish)
      # passes -PandroidReleaseSigningRequired=true to turn that same unconfigured state into a
      # hard failure instead.
      # macOS is deliberately not in this matrix: a plain `build` there repeats the Android build
      # this job already does on Linux and links every Kotlin/Native framework in both build types
      # (~11 min, never build-cached). The macOS-only checks run in `build-macos-desktop` and
      # `build-apple` below instead, in parallel.
      - name: Build & Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" ./gradlew build --no-configuration-cache
          else
            ./gradlew build --no-configuration-cache
          fi
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      # Packaging (createDistributable / jpackage) exercises code paths `build` never touches:
      # nativeDistributions.modules (a missing jlink module only breaks the packaged binary at
      # launch, not this build step - see docs/build.md "Notes"). Windows is included too:
      # windows-latest ships WiX Toolset v3.14.1 preinstalled, which is all packageMsi needs.
      # macOS's own packaging check lives in `build-macos-desktop` below.
      # createDistributable is run first so a jlink-assembly failure is distinguishable from a
      # jpackage-specific one; the second invocation is a no-op rebuild via Gradle's up-to-date check.
      - name: Verify packaging (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew createDistributable --no-configuration-cache
          ./gradlew packageDeb packageRpm --no-configuration-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      # Regression guard for the split this app-in-update install relies on
      # (androidApp/build.gradle.kts's flavorDimensions comment, AndroidUpdateInstaller's own
      # KDoc): REQUEST_INSTALL_PACKAGES must be in the merged manifest for "github" (the sideload
      # flavor, where in-app update needs to actually create a PackageInstaller session) and absent
      # from "play" (a Play-distributed APK never installs its own updates). Checked both
      # directions — either one flipping is a real defect, not just noise. `./gradlew build` above
      # already builds these merged manifests via androidApp's default `assemble` lifecycle, so
      # these two tasks are themselves a no-op; only the grep below adds anything. Linux-only, like
      # the packaging verification above: this is a build-artifact assertion, not something that
      # can differ by OS.
      - name: Verify REQUEST_INSTALL_PACKAGES is github-only (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :androidApp:processGithubReleaseManifest :androidApp:processPlayReleaseManifest --no-configuration-cache
          GITHUB_MANIFEST=androidApp/build/intermediates/merged_manifests/githubRelease/processGithubReleaseManifest/AndroidManifest.xml
          PLAY_MANIFEST=androidApp/build/intermediates/merged_manifests/playRelease/processPlayReleaseManifest/AndroidManifest.xml
          if ! grep -q "REQUEST_INSTALL_PACKAGES" "$GITHUB_MANIFEST"; then
            echo "::error::REQUEST_INSTALL_PACKAGES is missing from the github flavor's merged manifest ($GITHUB_MANIFEST) — in-app update install would fail there."
            exit 1
          fi
          if grep -q "REQUEST_INSTALL_PACKAGES" "$PLAY_MANIFEST"; then
            echo "::error::REQUEST_INSTALL_PACKAGES leaked into the play flavor's merged manifest ($PLAY_MANIFEST) — a Play-distributed APK must never request it."
            exit 1
          fi
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      # Regression guard for androidApp/build.gradle.kts's versionCodeOf: a pre-release tag and
      # its eventual final release must never fold to the same versionCode (Play rejects a
      # re-upload at an already-used one), and the fold must stay monotonically increasing across
      # a version's own alpha -> beta -> rc -> final progression. Also guards a bare pre-release
      # label (`0.19.0-alpha`) against silently folding to the same versionCode as its explicit
      # `.1` form (`0.19.0-alpha.1`) — SemVer orders the two, so their versionCodes must differ
      # too. `printAndroidVersionCodes` is a plain stdout probe (see its own KDoc) rather than a
      # unit test, since versionCodeOf lives in this *.gradle.kts script and has no test source set
      # of its own. Linux-only, like the manifest check above: this is a build-script assertion,
      # not something that can differ by OS.
      - name: Verify Android versionCode scheme (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :androidApp:printAndroidVersionCodes --no-configuration-cache \
            -PversionCodeProbe=0.18.0,0.19.0-alpha,0.19.0-alpha.1,0.19.0-beta.1,0.19.0-rc.1,0.19.0,1.0.0-rc.2,1.0.0 \
            | tee "$RUNNER_TEMP/version-codes.txt"

          declare -A expected=(
            ["0.18.0"]=180099
            ["0.19.0-alpha"]=190000
            ["0.19.0-alpha.1"]=190001
            ["0.19.0-beta.1"]=190031
            ["0.19.0-rc.1"]=190061
            ["0.19.0"]=190099
            ["1.0.0-rc.2"]=1000062
            ["1.0.0"]=1000099
          )
          for version in "${!expected[@]}"; do
            actual=$(grep "^${version}=" "$RUNNER_TEMP/version-codes.txt" | cut -d= -f2)
            if [ "$actual" != "${expected[$version]}" ]; then
              echo "::error::versionCodeOf($version) = $actual, expected ${expected[$version]}."
              exit 1
            fi
          done

          # 0.19.0's own alpha -> beta -> rc -> final progression must be strictly increasing, or a
          # later pre-release build could look like a downgrade of an earlier one to Play/the
          # package manager. Starts at the bare `-alpha` label's own ordinal (0), one step before
          # its explicit `.1` form.
          progression=(190000 190001 190031 190061 190099)
          for i in "${!progression[@]}"; do
            if [ "$i" -gt 0 ] && [ "${progression[$i]}" -le "${progression[$((i - 1))]}" ]; then
              echo "::error::versionCode progression is not strictly increasing: ${progression[*]}"
              exit 1
            fi
          done
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Verify packaging (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./gradlew createDistributable --no-configuration-cache
          ./gradlew packageMsi --no-configuration-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: warn

  # The Compose desktop app on macOS: its JVM test suites (some cases, like ArchiveExtractorTest's
  # `ditto` ones, only run on macOS) and its packaging. Android is not rebuilt here — the `build`
  # job already covers it on Linux, and nothing about it differs by host OS.
  build-macos-desktop:
    name: Build & Test (macos-latest desktop)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & Test (desktop only)
        run: ./gradlew :shared:desktopTest :composeApp:desktopTest --no-configuration-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      # Packaging (createDistributable / jpackage) exercises code paths the tests never touch:
      # nativeDistributions.modules, restoreMacOsShortVersion, and the DMG icon-setting hook — see
      # the same step in the `build` job.
      - name: Verify packaging (macOS)
        shell: bash
        run: |
          ./gradlew createDistributable --no-configuration-cache
          # jpackage builds the DMG by mounting a scratch disk image and detaching it again, and
          # that detach intermittently fails on a runner ("Command failed (exit 16): hdiutil
          # detach") while Spotlight still holds the volume - unrelated to the packaging
          # regressions this step exists to catch. Only an hdiutil failure is retried, so a real
          # regression still fails on the first attempt.
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/packageDmg-$attempt.log"
            if ./gradlew packageDmg --no-configuration-cache 2>&1 | tee "$log"; then
              break
            fi
            if [ "$attempt" = 3 ] || ! grep -q hdiutil "$log"; then
              exit 1
            fi
            echo "::warning::packageDmg hit a transient hdiutil failure (attempt $attempt); retrying."
            # A failed detach leaves the volume mounted, and the next attempt would be mounted
            # alongside it as "Keryx 1" instead, where jpackage cannot find it.
            for volume in /Volumes/Keryx*; do
              if [ -d "$volume" ]; then hdiutil detach "$volume" -force || true; fi
            done
            sleep 5
          done
          # The other half of what makes an in-app update work, and the half no unit test can
          # reach: that the release ZIP, built exactly as release.yml builds it, survives being
          # unpacked again. `zip -y` has to store the bundled JDK's symlinks as links and `ditto`
          # has to restore them, or the swapped-in bundle fails its own `codesign` check on the
          # user's machine (see docs/background-update.md). createDistributable's own guard covers
          # the seal; nothing but this covers the round trip.
          app=composeApp/build/compose/binaries/main/app/Keryx.app
          links_before=$(find "$app" -type l | wc -l | tr -d ' ')
          (cd "$(dirname "$app")" && zip -qry "$RUNNER_TEMP/roundtrip.zip" Keryx.app)
          ditto -x -k "$RUNNER_TEMP/roundtrip.zip" "$RUNNER_TEMP/roundtrip"
          links_after=$(find "$RUNNER_TEMP/roundtrip/Keryx.app" -type l | wc -l | tr -d ' ')
          if [ "$links_before" != "$links_after" ]; then
            echo "::error::Symlinks lost in the archive round trip: $links_before before, $links_after after."
            exit 1
          fi
          codesign --verify --strict --deep "$RUNNER_TEMP/roundtrip/Keryx.app"
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-macos-desktop
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: warn

  # :shared's Apple side (Kotlin/Native) and the appleApp/ SwiftUI project that links it. Only the
  # release XCFramework is linked — once — since that is what the app consumes; linking the
  # debug frameworks too would add ~5 min without verifying anything the release link and the
  # test-binary links don't already.
  build-apple:
    name: Build & Test (macos-latest apple)
    runs-on: macos-latest
    timeout-minutes: 30
    # Job-level so every Gradle invocation here — including the one Scripts/build-shared.sh makes
    # from inside xcodebuild's prebuild phase — sees identical inputs and stays up-to-date instead
    # of re-linking the framework.
    env:
      DROPBOX_APP_KEY: ""
      ONEDRIVE_CLIENT_ID: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test (macOS + iOS simulator)
        run: ./gradlew :shared:macosArm64Test :shared:iosSimulatorArm64Test --no-configuration-cache

      # The KeryxShared XCFramework the native Apple app links: every slice (macOS, iOS device,
      # iOS simulator) including SKIE's generated Swift, which the tests above never compile.
      # Xcode checks that it exists while planning the build, before the target's prebuild script
      # (Scripts/build-shared.sh) gets to assemble it, so on a fresh checkout it must already be
      # there — and before `xcodegen generate`, which otherwise generates the project without the
      # framework reference. The prebuild's own Gradle run is then up-to-date.
      - name: Verify Apple framework
        run: ./gradlew :shared:assembleKeryxSharedReleaseXCFramework --no-configuration-cache

      # Builds the appleApp/ SwiftUI project (XcodeGen-generated from project.yml; the
      # .xcodeproj itself is never committed — see .gitignore) for macOS and iOS Simulator, and
      # runs its Swift Testing target on macOS. Signing is skipped outright
      # (CODE_SIGNING_ALLOWED=NO), not just ad-hoc: Keryx.entitlements' app sandbox always
      # requires a real Apple Development/Developer ID certificate to embed (confirmed locally —
      # an ad-hoc identity with no team fails with "requires a provisioning profile" even under
      # CODE_SIGN_STYLE=Manual), and no CI runner has one configured. This only verifies Swift
      # compiles and links against KeryxShared; it does not confirm the sandboxed app runs, which
      # is the same limitation `docs/build.md`'s "Building the SwiftUI app" documents for a local
      # build with no Local.xcconfig team configured either.
      - name: Verify SwiftUI app
        shell: bash
        run: |
          brew install xcodegen
          cd appleApp
          xcodegen generate
          xcodebuild -scheme Keryx -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme Keryx -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme Keryx -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-apple
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: warn

  # A separate job rather than another `build` matrix entry: `./gradlew build` pulls in
  # :androidApp's release APK via AGP's default `assemble` lifecycle, and aapt2 (AGP's own
  # resource compiler) ships a linux-x86_64 binary only — there is no linux-aarch64 build of it —
  # so a plain `build` cannot succeed on this runner at all. This job instead runs only the
  # desktop-side tasks release.yml's own `package-linux` (arm64 leg) actually needs.
  build-linux-arm64:
    name: Build & Test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Required even though this job never builds :androidApp: :composeApp is an
      # android.kotlin.multiplatform.library (see its `android { compileSdk = 37 }` block), so AGP
      # needs ANDROID_HOME to resolve just the *configuration* phase — every Gradle invocation
      # below would otherwise fail before reaching its own task. Unlike the same step in
      # release.yml's `package-android` job (there to guard against a future runner-image change,
      # since ubuntu-latest already ships the SDK), this one is load-bearing: the arm64 runner
      # image ships no Android SDK at all.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # Compose UI tests (runDesktopComposeUiTest) render real Skia/AWT and need a display; see the
      # same step in the `build` job above. libegl1 is needed only here: libskiko-linux-arm64.so
      # links directly against libEGL.so.1 (alongside libGL.so.1 / libX11.so.6 /
      # libfontconfig.so.1, which are already present on this runner image), and unlike the
      # ubuntu-latest image the ubuntu-24.04-arm one does not ship it — without it every Compose
      # UI test dies inside skiko's LibraryLoader before rendering anything.
      - name: Install xvfb and Skia's native dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1

      # jpackage shells out to fakeroot for .deb and rpmbuild (package "rpm") for .rpm.
      - name: Install Linux packaging tools
        run: sudo apt-get install -y fakeroot rpm

      - name: Build & Test (desktop only)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" ./gradlew :shared:desktopTest :composeApp:desktopTest --no-configuration-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      # Same two-step split as the `build` job's "Verify packaging (Linux)": createDistributable
      # first so a jlink-assembly failure is distinguishable from a jpackage-specific one.
      - name: Verify packaging
        run: |
          ./gradlew createDistributable --no-configuration-cache
          ./gradlew packageDeb packageRpm --no-configuration-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-ubuntu-24.04-arm
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: warn

  android-instrumented-test:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs KVM to start in a reasonable time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The composeApp module is an android.kotlin.multiplatform.library, so Gradle needs the
      # Android SDK (ANDROID_HOME) to resolve compileSdk even before the emulator starts.
      # platforms;android-37 is deliberately not installed here: since API 37, Google publishes
      # platform packages per minor revision (platforms;android-37.0, .1, ...) instead of a flat
      # platforms;android-37, so that literal package id doesn't exist ("Failed to find package").
      # AGP's own SDK auto-download resolves the correct minor version for `compileSdk = 37`
      # during the Gradle build below instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          # Only the "github" flavor (see androidApp/build.gradle.kts's flavorDimensions) — the
          # instrumented suite doesn't exercise anything flavor-specific (the two differ only in
          # the REQUEST_INSTALL_PACKAGES manifest permission). There's no "play" debug variant to
          # fall back to either way: build.gradle.kts disables playDebug entirely, so
          # connectedAndroidTest (no flavor) now runs only githubDebug, same as this explicit task.
          # :shared:connectedAndroidDeviceTest runs on the same emulator: DatabaseMerger/
          # DatabaseSnapshot against the real bundled SQLite (see docs/testing.md's instrumented-
          # suite table). It was previously "local only". :composeApp's own androidDeviceTest
          # suite (SAF writes, Keystore token storage, Play services token-scope checks) is left
          # out of this change — bringing it into CI too is a separate follow-up.
          script: ./gradlew :androidApp:connectedGithubDebugAndroidTest :shared:connectedAndroidDeviceTest --no-configuration-cache
        # No GOOGLE_DRIVE_CLIENT_ID/SECRET: Google Drive's client secret now generates into
        # DesktopBuildConfig, attached only to desktopMain's srcDir, so it isn't a build input for
        # :androidApp — see the same comment in release.yml's "Build Android release packages" step.
        env:
          DROPBOX_APP_KEY: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Upload instrumented test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-android-instrumented
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
            shared/build/reports/androidTests/
            shared/build/outputs/androidTest-results/
          if-no-files-found: warn
