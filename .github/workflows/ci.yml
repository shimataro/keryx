name: CI

on:
  - push

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS/Linux additionally run createDistributable + native packaging below, so this matches
    # the 30 min budget release.yml's packaging jobs use (plain `build` alone needed only ~20).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compose UI tests (runDesktopComposeUiTest) render real Skia/AWT and need a display.
      # The Linux runner is headless, so run Gradle under a virtual X server (xvfb).
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # jpackage shells out to fakeroot for .deb and rpmbuild (package "rpm") for .rpm; neither
      # is guaranteed present on the ubuntu-latest image (see docs/setup.md).
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot rpm

      # `./gradlew build` pulls in :androidApp's release build type via AGP's default `assemble`
      # lifecycle. This job never publishes any artifact, so it deliberately supplies no signing
      # secrets — androidApp/build.gradle.kts's own signingConfigs block then builds an unsigned
      # release APK (with a build warning) instead of failing, which is exactly the behavior a
      # plain, unconfigured `./gradlew build` should have. Only release.yml (which does publish)
      # passes -PandroidReleaseSigningRequired=true to turn that same unconfigured state into a
      # hard failure instead.
      - name: Build & Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" ./gradlew build --no-configuration-cache
          else
            ./gradlew build --no-configuration-cache
          fi
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      # Packaging (createDistributable / jpackage) exercises code paths `build` never touches:
      # nativeDistributions.modules (a missing jlink module only breaks the packaged binary at
      # launch, not this build step - see docs/build.md "Notes"), restoreMacOsShortVersion, and
      # the DMG icon-setting hook. Windows is included too: windows-latest ships WiX Toolset
      # v3.14.1 preinstalled, which is all packageMsi needs.
      # createDistributable is run first so a jlink-assembly failure is distinguishable from a
      # jpackage-specific one; the second invocation is a no-op rebuild via Gradle's up-to-date check.
      - name: Verify packaging (macOS)
        if: runner.os == 'macOS'
        run: |
          ./gradlew createDistributable --no-configuration-cache
          ./gradlew packageDmg --no-configuration-cache
          # The other half of what makes an in-app update work, and the half no unit test can
          # reach: that the release ZIP, built exactly as release.yml builds it, survives being
          # unpacked again. `zip -y` has to store the bundled JDK's symlinks as links and `ditto`
          # has to restore them, or the swapped-in bundle fails its own `codesign` check on the
          # user's machine (see docs/background-update.md). createDistributable's own guard covers
          # the seal; nothing but this covers the round trip.
          app=composeApp/build/compose/binaries/main/app/Keryx.app
          links_before=$(find "$app" -type l | wc -l | tr -d ' ')
          (cd "$(dirname "$app")" && zip -qry "$RUNNER_TEMP/roundtrip.zip" Keryx.app)
          ditto -x -k "$RUNNER_TEMP/roundtrip.zip" "$RUNNER_TEMP/roundtrip"
          links_after=$(find "$RUNNER_TEMP/roundtrip/Keryx.app" -type l | wc -l | tr -d ' ')
          if [ "$links_before" != "$links_after" ]; then
            echo "::error::Symlinks lost in the archive round trip: $links_before before, $links_after after."
            exit 1
          fi
          codesign --verify --strict --deep "$RUNNER_TEMP/roundtrip/Keryx.app"
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Verify packaging (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew createDistributable --no-configuration-cache
          ./gradlew packageDeb packageRpm --no-configuration-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      # Regression guard for the split this app-in-update install relies on
      # (androidApp/build.gradle.kts's flavorDimensions comment, AndroidUpdateInstaller's own
      # KDoc): REQUEST_INSTALL_PACKAGES must be in the merged manifest for "github" (the sideload
      # flavor, where in-app update needs to actually create a PackageInstaller session) and absent
      # from "play" (a Play-distributed APK never installs its own updates). Checked both
      # directions — either one flipping is a real defect, not just noise. `./gradlew build` above
      # already builds these merged manifests via androidApp's default `assemble` lifecycle, so
      # these two tasks are themselves a no-op; only the grep below adds anything. Linux-only, like
      # the packaging verification above: this is a build-artifact assertion, not something that
      # can differ by OS.
      - name: Verify REQUEST_INSTALL_PACKAGES is github-only (Linux)
        if: runner.os == 'Linux'
        run: |
          ./gradlew :androidApp:processGithubReleaseManifest :androidApp:processPlayReleaseManifest --no-configuration-cache
          GITHUB_MANIFEST=androidApp/build/intermediates/merged_manifests/githubRelease/processGithubReleaseManifest/AndroidManifest.xml
          PLAY_MANIFEST=androidApp/build/intermediates/merged_manifests/playRelease/processPlayReleaseManifest/AndroidManifest.xml
          if ! grep -q "REQUEST_INSTALL_PACKAGES" "$GITHUB_MANIFEST"; then
            echo "::error::REQUEST_INSTALL_PACKAGES is missing from the github flavor's merged manifest ($GITHUB_MANIFEST) — in-app update install would fail there."
            exit 1
          fi
          if grep -q "REQUEST_INSTALL_PACKAGES" "$PLAY_MANIFEST"; then
            echo "::error::REQUEST_INSTALL_PACKAGES leaked into the play flavor's merged manifest ($PLAY_MANIFEST) — a Play-distributed APK must never request it."
            exit 1
          fi
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Verify packaging (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./gradlew createDistributable --no-configuration-cache
          ./gradlew packageMsi --no-configuration-cache
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: warn

  android-instrumented-test:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs KVM to start in a reasonable time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The composeApp module is an android.kotlin.multiplatform.library, so Gradle needs the
      # Android SDK (ANDROID_HOME) to resolve compileSdk even before the emulator starts.
      # platforms;android-37 is deliberately not installed here: since API 37, Google publishes
      # platform packages per minor revision (platforms;android-37.0, .1, ...) instead of a flat
      # platforms;android-37, so that literal package id doesn't exist ("Failed to find package").
      # AGP's own SDK auto-download resolves the correct minor version for `compileSdk = 37`
      # during the Gradle build below instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools build-tools;36.0.0"

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          # Only the "github" flavor (see androidApp/build.gradle.kts's flavorDimensions) — the
          # instrumented suite doesn't exercise anything flavor-specific (the two differ only in
          # the REQUEST_INSTALL_PACKAGES manifest permission). There's no "play" debug variant to
          # fall back to either way: build.gradle.kts disables playDebug entirely, so
          # connectedAndroidTest (no flavor) now runs only githubDebug, same as this explicit task.
          script: ./gradlew :androidApp:connectedGithubDebugAndroidTest --no-configuration-cache
        # No GOOGLE_DRIVE_CLIENT_ID/SECRET: Google Drive's client secret now generates into
        # DesktopBuildConfig, attached only to desktopMain's srcDir, so it isn't a build input for
        # :androidApp — see the same comment in release.yml's "Build Android release packages" step.
        env:
          DROPBOX_APP_KEY: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Upload instrumented test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-android-instrumented
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
          if-no-files-found: warn
