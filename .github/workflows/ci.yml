name: CI

on:
  - push

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compose UI tests (runDesktopComposeUiTest) render real Skia/AWT and need a display.
      # The Linux runner is headless, so run Gradle under a virtual X server (xvfb).
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build & Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" ./gradlew build --no-configuration-cache
          else
            ./gradlew build --no-configuration-cache
          fi
        env:
          DROPBOX_APP_KEY: ""
          GOOGLE_DRIVE_CLIENT_ID: ""
          GOOGLE_DRIVE_CLIENT_SECRET: ""
          ONEDRIVE_CLIENT_ID: ""

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: warn
