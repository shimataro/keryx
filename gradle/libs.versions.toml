[versions]
kotlin = "2.4.10"
compose-multiplatform = "1.11.1"
sqldelight = "2.3.2"
sqlite-jdbc = "3.53.2.0"
ktor = "3.5.1"
koin = "4.2.2"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
xmlutil = "1.0.1"
coil = "3.5.0"
lifecycle = "2.11.0"
ksoup = "0.2.6"
javakeyring = "1.0.4"
jna = "5.19.1"
composewebview = "1.0.0-beta-02"
slf4j = "2.0.18"
flatlaf = "3.7.2"

# Pinned to the version java-keyring already brings in transitively
# (java-keyring -> de.swiesend:secret-service -> dbus-java-core). secret-service 1.8.1
# does `instanceof org.freedesktop.dbus.errors.Error`, and dbus-java 5.x moved that class
# to org.freedesktop.dbus.messages.Error - upgrading would break the Linux Secret Service
# keyring (i.e. cloud token storage) with a NoClassDefFoundError. Revisit when java-keyring
# moves to a secret-service release built against dbus-java 5.
dbusjava = "4.2.1"

# material3 is versioned independently from the Compose Multiplatform plugin
# (compose-multiplatform). When bumping compose-multiplatform, verify/update
# compose-material3 to the version that release aligns to.
compose-material3 = "1.9.0"

[libraries]
# Compose Multiplatform direct dependencies
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }

# --- SQLDelight (local DB) ---
sqldelight-driver-jdbc-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-dialect-sqlite338 = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

# --- Ktor (HTTP: feed fetch + Dropbox REST) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- Koin (dependency injection) ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# --- kotlinx ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# --- XML / OPML ---
xmlutil-serialization = { module = "io.github.pdvrieze.xmlutil:serialization", version.ref = "xmlutil" }
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }

# --- HTML parsing (feed discovery / reader view) ---
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }

# --- Image loading (favicons / thumbnails) ---
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }

# --- Compose lifecycle ViewModel ---
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Desktop-only ---
javakeyring = { module = "com.github.javakeyring:java-keyring", version.ref = "javakeyring" }
# Modern Swing Look & Feel. Only installed on Linux (see ui/theme/DesktopLookAndFeel.kt) —
# macOS keeps Aqua and Windows keeps its system L&F, both of which already look native.
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
jna-jpms = { module = "net.java.dev.jna:jna-jpms", version.ref = "jna" }
jna-platform-jpms = { module = "net.java.dev.jna:jna-platform-jpms", version.ref = "jna" }

# --- D-Bus (Linux StatusNotifierItem tray + desktop notifications) ---
# Already on the runtime classpath transitively via java-keyring; declared explicitly here
# because the tray now uses it directly. Shipped on every platform but only touched at
# runtime on Linux. The native-unixsocket transport is pure NIO
# (java.net.UnixDomainSocketAddress), so it needs no JNI.
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbusjava" }
dbus-java-transport-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbusjava" }

# --- WebView (spike: OS-native WebView for article content view) ---
composewebview = { module = "io.github.kdroidfilter:composewebview", version.ref = "composewebview" }

# --- Logging (desktop runtime; silences "No SLF4J providers were found") ---
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# --- Test ---
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
