name: keryx
version: '0.0.0' # overwritten by release.yml with the tag-derived version before packing
summary: Cloud-sync, multi-platform RSS reader
description: |
  Keeps your subscriptions in sync across every device through your own cloud storage
  (Dropbox / Google Drive / OneDrive).
grade: stable
confinement: strict
base: core24
license: MIT
website: https://keryx.merc.works
contact: keryx@merc.works
issues: https://github.com/shimataro/keryx/issues
source-code: https://github.com/shimataro/keryx

apps:
  keryx:
    command: bin/Keryx
    environment:
      XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
      XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
    plugs:
      - network
      - password-manager-service # Secret Service (java-keyring) — Dropbox token storage
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl # Compose Desktop (Skia) GPU rendering
      - home # keryx:// URI scheme / .opml association self-registration
             # (~/.local/share/applications, ~/.config/mimeapps.list)

parts:
  keryx:
    plugin: dump
    source: composeApp/build/compose/binaries/main/app/Keryx
    stage-packages:
      # AWT/Swing (JMenuBar, JFileChooser, FlatLaf) needs the X11 client libraries even under Wayland
      - libx11-6
      - libxext6
      - libxi6
      - libxrender1
      - libxtst6
      # Font rendering (Skiko + JDK fontmanager)
      - libfontconfig1
      - libfreetype6
      # OpenGL (Skiko / Compose Desktop GPU rendering)
      - libgl1
