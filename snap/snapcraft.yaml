name: keryx
version: '0.0.0' # overwritten by release.yml with the tag-derived version before packing
summary: Cloud-sync, multi-platform RSS reader
description: |
  Keeps your subscriptions in sync across every device through your own cloud storage
  (Dropbox / Google Drive / OneDrive).
grade: stable
confinement: strict
base: core24
license: MIT
website: https://keryx.merc.works
contact: keryx@merc.works
issues: https://github.com/shimataro/keryx/issues
source-code: https://github.com/shimataro/keryx

apps:
  keryx:
    extensions: [gnome]
    command: bin/Keryx
    environment:
      XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
      XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
      # WebKit's nested sandbox (bwrap) does not start inside strict confinement
      WEBKIT_DISABLE_SANDBOX: "1"
    plugs:
      - network
      - password-manager-service
      - home

parts:
  keryx:
    plugin: dump
    source: composeApp/build/compose/binaries/main/app/Keryx
    stage-packages:
      # WebKitGTK runtime (article reader WebView) — not covered by gnome extension
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0
      - libsoup-3.0-0
      - libsecret-1-0
      # AWT X11 extension (gnome extension may not include this)
      - libxtst6
      # JNA native dispatch library
      - libffi8
