name: Keryx
options:
  createIntermediateGroups: true
  # English is the String Catalog's source language and the fallback for any locale the app does
  # not ship (external-spec §8): a Japanese system gets Japanese, everything else English. Xcode
  # requires the project's development language to match the catalog's sourceLocale, and it
  # becomes CFBundleDevelopmentRegion, i.e. that fallback.
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: YES
    # Apple Silicon only, matching :shared's own Apple targets (macosArm64/iosArm64/
    # iosSimulatorArm64 — see docs/app-architecture.md's "Apple targets in :shared"): the
    # XCFramework has no x86_64 simulator slice, so building for it would fail to link.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # The same for macOS: the XCFramework has only a macos-arm64 slice, and a Release build (the
    # release archive) defaults to arm64 + x86_64, whose x86_64 pass cannot import the framework's
    # Swift module ("cannot find type ..." on every shared type). Debug builds only the active arch,
    # which is why CI never hit it.
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
  configs:
    Debug: {}
    Release: {}

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  # macOS-only auto-update framework (the GitHub Release build); neither the iOS build nor the Mac
  # App Store build links it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

# What the two app targets share. `Keryx` is the iOS app and the GitHub Release macOS app;
# `KeryxMacAppStore` is the same macOS app without Sparkle, which App Review does not allow
# (guideline 2.4.5(vii)). Linking is decided per target, so a build configuration could not drop it.
# XcodeGen merges a target onto its template key by key and appends to arrays, so anything only one
# target wants stays out of here: the mach-lookup entitlement above all, which a
# `[sdk=macosx*]` setting in here would hand to the Mac App Store build too.
targetTemplates:
  KeryxApp:
    type: application
    platform: auto
    sources:
      # Generated by :composeApp:generateStringCatalog (build-shared.sh's prebuild script below
      # regenerates it every build) from composeResources/values*/strings.xml — never committed,
      # never hand-edited. See docs/build.md's "String Catalog for the Apple app".
      - path: ../composeApp/build/generated/stringCatalog/Localizable.xcstrings
      # The tray glyph shared with the Compose desktop build, referenced in place rather than
      # copied so the two can't drift. Used as a template image (only its alpha matters).
      - path: ../composeApp/src/commonMain/composeResources/drawable/tray_icon.png
        buildPhase: resources
        destinationFilters: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.merc.keryx
        PRODUCT_NAME: Keryx
        INFOPLIST_KEY_CFBundleDisplayName: Keryx
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 Mercury Works"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        CODE_SIGN_ENTITLEMENTS: Keryx/Keryx.entitlements
        # Required for notarization (the Developer ID release build); harmless for a local ad-hoc
        # build. Sparkle and the app are signed with the same identity, so library validation holds.
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # -ObjC force-loads every ObjC class/category in the static KeryxShared framework. Dropping
        # it builds, tests and launches fine, but only an empty-database launch was exercised and
        # no size/startup gain was measured, so it stays until a run through every screen shows
        # the framework does not depend on it.
        OTHER_LDFLAGS: "-lsqlite3 -ObjC $(inherited)"
        # Xcode's localization sync scans Swift for strings to extract. With this on it treats every
        # SwiftUI initializer (`Text(L("home_all_feeds"))`, …) as a localizable string and warns that
        # its key is not a literal. Here the catalog keys are opaque identifiers and those calls
        # pass an already-localized String (see Keryx/Platform/Localized.swift), so there is
        # nothing to extract from the Swift sources.
        LOCALIZED_STRING_SWIFTUI_SUPPORT: NO
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/KeryxShared.xcframework
        embed: false
        link: true
    info:
      properties:
        # Feeds and their images are fetched from servers the user chooses, some of which only
        # serve plain http:// (external-spec §10 honors an explicit http:// URL). The arbitrary-loads
        # exception covers URLSession (feeds, favicons) and the reader's WKWebView alike; do NOT add
        # NSAllowsArbitraryLoadsInWebContent, which would make iOS 10+/macOS 10.12+ ignore this key.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Only HTTPS and hashing (CommonCrypto/Security) — exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        # An opened .opml is read once, in place, through a coordinated read (App/AppModel.swift's
        # importOpenedOpml), so iOS needn't copy it into the app's Inbox first. Declaring it also
        # answers upload validation's ITMS-90737 for the CFBundleDocumentTypes below.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: OPML Document
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.opml.opml
              - com.reederapp.opml
              - unofficial.opml
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML Document
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
          - UTTypeIdentifier: com.reederapp.opml
            UTTypeDescription: OPML Document
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
          - UTTypeIdentifier: unofficial.opml
            UTTypeDescription: OPML Document
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: works.merc.keryx.app.feedlistitem.feed
            UTTypeDescription: Keryx Feed List Feed
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: works.merc.keryx.app.feedlistitem.folder
            UTTypeDescription: Keryx Feed List Folder
            UTTypeConformsTo:
              - public.data
    prebuildScripts:
      - name: Build KeryxShared
        script: "\"$SRCROOT/Scripts/build-shared.sh\"\n"
        basedOnDependencyAnalysis: false

targets:
  Keryx:
    templates: [KeryxApp]
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Keryx
    settings:
      base:
        # macOS adds the mach-lookup exception Sparkle's sandboxed installer needs; keep the two
        # files' shared entries in step.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Keryx/Keryx-macOS.entitlements
        # A macOS bundle keeps embedded frameworks (Sparkle) in Contents/Frameworks, one level up
        # from the executable; the default run path (@executable_path/Frameworks) only fits iOS.
        # Without this the app dies at launch with "Library not loaded: Sparkle.framework". The
        # debug dylib Xcode splits the app into loads from Contents/MacOS too, hence @loader_path.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPad multitasking requires all four orientations (App Store Connect rejects the upload
        # otherwise, ITMS-90474); iPhone gets the three that make sense on a phone.
        # Scripts/verify-store-requirements.sh checks the built app for the same iPad list.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
    info:
      path: Generated-Info.plist
      properties:
        # iOS-only keys (macOS ignores them): the periodic background refresh, see
        # Platform/BackgroundRefresh.swift.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [works.merc.keryx.refresh]
        # macOS-only Sparkle keys (iOS ignores them). SPARKLE_PUBLIC_ED_KEY comes from
        # Config/Shared.xcconfig; while it is empty the updater stays off (Update/AppUpdater.swift).
        SUFeedURL: https://github.com/shimataro/keryx/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableInstallerLauncherService: true

  # The macOS app as it goes to the Mac App Store: no Sparkle, so no update UI and no mach-lookup
  # exception. Same bundle ID as `Keryx`, since App Store Connect keeps iOS and macOS in one record.
  KeryxMacAppStore:
    templates: [KeryxApp]
    # `auto` with one destination rather than `platform: macOS`, so the template's
    # `destinationFilters` keep applying.
    supportedDestinations: [macOS]
    sources:
      - path: Keryx
        excludes:
          - Update/**
    settings:
      base:
        # Read by the `#if`s around the updater's call sites; `canImport(Sparkle)` would not do,
        # since a shared DerivedData can leave the module findable.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MAC_APP_STORE $(inherited)"
    info:
      path: Generated-Info-MacAppStore.plist

  KeryxTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    # Logic-only test bundle (no TEST_HOST/app dependency): sidesteps a cross-platform
    # (supportedDestinations) TEST_HOST path mismatch between macOS's Contents/MacOS/ bundle
    # layout and iOS's flat one. Sources that need testing are added to this target's own
    # `sources:` list directly (see Bridge/Localization once they exist) rather than hosted
    # inside Keryx.app. Revisit if a test genuinely needs the running app.
    sources:
      - path: KeryxTests
      - path: Keryx/Home/ReaderNavigationGate.swift
      - path: Keryx/Home/ReaderRebuildThrottle.swift
      - path: Keryx/Home/ReaderPageInputs.swift
      - path: Keryx/Home/ArticleTableRevealTracker.swift
      - path: Keryx/Home/ArticleListTopReset.swift
      - path: Keryx/Home/ArticleListScrollGate.swift
      - path: Keryx/Home/ReaderProcessRecovery.swift
      - path: Keryx/Home/ReaderScrollPosition.swift
      - path: Keryx/Home/ReaderScrollIndicator.swift
      - path: Keryx/Home/FeedListSelectionEquality.swift
      - path: Keryx/Home/CompactSidebarSelection.swift
      - path: Keryx/Home/CompactSearchNavigation.swift
      - path: Keryx/Home/CompactColumnRestoration.swift
      - path: Keryx/Home/HomeRestoration.swift
      - path: Keryx/Home/ArticleListHeaderIcon.swift
      - path: Keryx/Home/PullToRefreshAvailability.swift
      - path: Keryx/Home/PullRefreshHold.swift
      - path: Keryx/Home/RefreshStatus.swift
      - path: Keryx/Home/AbandonableRefresh.swift
      - path: Keryx/Home/AlertToastAnnouncement.swift
      - path: Keryx/Home/ArticleListRemount.swift
      - path: Keryx/Home/FeedListDropPresentation.swift
      - path: Keryx/Home/SidebarDialogState.swift
      - path: Keryx/Settings/SettingsNavigation.swift
      - path: Keryx/Bridge/OpmlTransferObservable.swift
      - path: Keryx/Platform/Localized.swift
      - path: Keryx/Platform/DockBadge.swift
      - path: Keryx/Update/UpdateCheckFailure.swift
      - path: Keryx/Platform/AppIconBadge.swift
      - path: Keryx/Platform/BackgroundRefreshDate.swift
      - path: Keryx/Platform/NotificationAuthorizationPolicy.swift
      - path: Keryx/Bridge/ArticleRowModel.swift
      - path: Keryx/Bridge/ArticleUrlCopy.swift
      - path: Keryx/Bridge/TransientToastState.swift
      - path: Keryx/Bridge/HeldRefreshStatus.swift
      - path: Keryx/Bridge/ReaderPagerIndex.swift
      - path: Keryx/Bridge/SidebarModel.swift
      - path: Keryx/Bridge/ObservableAssignment.swift
      - path: Keryx/Home/SidebarRowHighlight.swift
      - path: Keryx/Home/Sidebar/SidebarItemID.swift
      - path: Keryx/Home/Sidebar/SidebarOutline.swift
      - path: Keryx/Home/Sidebar/SidebarRowContent.swift
      - path: Keryx/Home/Sidebar/SidebarUnreadCounts.swift
      - path: Keryx/Home/Sidebar/TagColorNames.swift
      - path: Keryx/Home/Sidebar/SidebarRenameTarget.swift
      - path: Keryx/Home/Sidebar/SidebarSwipeActions.swift
      - path: Keryx/Home/Sidebar/SidebarReorder.swift
      - path: Keryx/Home/Sidebar/SidebarDropResolver.swift
      - path: Keryx/Home/Sidebar/SidebarDropPreview.swift
      - path: Keryx/Home/Sidebar/SidebarDropGuard.swift
      - path: Keryx/Home/Sidebar/SidebarDropGuardInstaller.swift
      - path: Keryx/Home/ArticleTableLayout.swift
      - path: Keryx/Home/ArticleTableReload.swift
      - path: Keryx/Home/FaviconFailureCache.swift
      - path: Keryx/Home/ContextMenuSelection.swift
    # KeryxShared statically linked (same as the Keryx target's own dependency) so
    # FeedListSelectionEqualityTests can build real Kotlin sealed-type values directly, rather than
    # faking their shape — the xcframework is already built by the time this runs, since the `Keryx`
    # target's own prebuild script (below) always builds first under the shared `Keryx` scheme.
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/KeryxShared.xcframework
        embed: false
        link: true
    settings:
      base:
        # KeryxShared's own SQLDelight driver needs libsqlite3's symbols at link time — same as the
        # Keryx target's identical setting above, needed here for the same reason now that this
        # target links the xcframework too.
        OTHER_LDFLAGS: "-lsqlite3 -ObjC $(inherited)"

schemes:
  Keryx:
    build:
      targets:
        Keryx: all
        KeryxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeryxTests
  KeryxMacAppStore:
    build:
      targets:
        KeryxMacAppStore: all
    run:
      config: Debug
