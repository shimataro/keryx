org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Compose Multiplatform
org.jetbrains.compose.experimental.macos.enabled=true

# The generateBuildConfig task captures a String property, which the
# configuration cache cannot serialize safely across script objects.
# Keep the configuration cache off until that task is proven cache-safe.
org.gradle.configuration-cache=false
# Allow Homebrew JDK for Compose packaging (checked by Compose plugin).
compose.desktop.packaging.checkJdkVendor=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# composeApp defines its own intermediate source set (jvmCommonMain, shared by desktop and
# Android) via explicit dependsOn() edges, which the Kotlin Gradle Plugin's Default Hierarchy
# Template doesn't recognize by that name. Disabling the template avoids its "not applied
# correctly" warning; it isn't relied on here since there are no other target groupings
# (native/Apple/JS) that would need it.
kotlin.mpp.applyDefaultHierarchyTemplate=false
