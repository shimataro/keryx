org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Compose Multiplatform
org.jetbrains.compose.experimental.macos.enabled=true

# The generateBuildConfig task captures a String property, which the
# configuration cache cannot serialize safely across script objects.
# Keep the configuration cache off until that task is proven cache-safe.
org.gradle.configuration-cache=false
# Allow Homebrew JDK for Compose packaging (checked by Compose plugin).
compose.desktop.packaging.checkJdkVendor=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# shared defines its own intermediate source set (jvmCommonMain, shared by desktop and Android)
# via explicit dependsOn() edges, which the Kotlin Gradle Plugin's Default Hierarchy Template
# doesn't recognize by that name. Disabling the template avoids its "not applied correctly"
# warning; the Apple grouping it would otherwise provide (appleMain/macosMain/iosMain) is wired
# by hand in shared/build.gradle.kts instead.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Lets shared native source sets (shared/src/appleMain) see third-party cinterop bindings — the
# SQLiter sqlite3 bindings RawSqliteConnection uses — not just the per-target compilations.
kotlin.mpp.enableCInteropCommonization=true
